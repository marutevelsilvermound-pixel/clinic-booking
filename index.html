<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbour Clinic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Book an appointment</h1>
    <label for="clinic">Clinic</label>
    <select id="clinic"></select>
    <ul id="services"></ul>
    <h2>Available times</h2>
    <ul id="slots"></ul>
    <div class="row"><input id="name" placeholder="Your name"><button id="book">Book appointment</button></div>
    <p id="confirm"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
